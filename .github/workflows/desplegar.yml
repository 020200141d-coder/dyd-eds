# Publica el sitio en el hosting cada vez que se sube un cambio a GitHub.
#
# InfinityFree no trae el modulo "Git Version Control" que tienen los cPanel
# completos, asi que el servidor no puede ir a buscar los cambios por su
# cuenta. Se hace al reves: GitHub se conecta por FTP y sube lo que cambio.
#
# El resultado es el mismo que pide la guia, y de hecho mas automatico: alla
# hay que entrar al panel y darle "Pull" a mano; aqui no se entra a ningun
# lado, alcanza con hacer push.
#
# Antes de que funcione hay que cargar tres secretos en GitHub, en
# Settings -> Secrets and variables -> Actions -> New repository secret:
#
#   FTP_SERVER     ftpupload.net
#   FTP_USERNAME   el usuario FTP del panel (empieza con if0_)
#   FTP_PASSWORD   la contrasena FTP del panel
#
# Se llaman secretos porque GitHub los guarda cifrados: no se ven en el
# codigo, no aparecen en el historial y quedan tapados en los registros.

name: Desplegar en el hosting

on:
  push:
    branches:
      - main
  # Tambien deja lanzarlo a mano desde la pestana Actions, sin tener que
  # inventar un cambio solo para probar el despliegue.
  workflow_dispatch:

jobs:
  subir:
    name: Subir los archivos por FTP
    runs-on: ubuntu-latest

    steps:
      - name: Traer el codigo del repositorio
        uses: actions/checkout@v4

      - name: Subir a InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}

          # InfinityFree gratuito no ofrece FTP cifrado, solo el clasico.
          protocol: ftp
          port: 21

          # Carpeta del servidor donde vive el sitio. La barra final importa.
          server-dir: /htdocs/dyd-eds/

          # -----------------------------------------------------------------
          # Lo que NO se toca. Esta herramienta sincroniza: borra del servidor
          # lo que no esta en el repositorio. Sin estas exclusiones, cada
          # despliegue destruiria cosas que solo existen alla.
          # -----------------------------------------------------------------
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            bd-hosting.php
            admin/files/**
            sql/**
            docs/**
            README.md
            **/node_modules/**
            **/.DS_Store

          # Registro detallado: si algo falla, el log dice en que archivo.
          log-level: standard
